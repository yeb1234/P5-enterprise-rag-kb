<text x="921" y="260" font-size="19" font-weight="700" fill="#0F172A">融合</text>
<text x="921" y="286" font-size="13" fill="#64748B">多路命中优先</text>
<text x="921" y="312" font-size="13" fill="#334155">RRF：Σ 1/(60 + 名次)</text>
<text x="921" y="336" font-size="13" fill="#334155">不同量纲分数不相加</text>
<text x="921" y="372" font-size="12" fill="#94A3B8">前 50 名进融合池</text>
<text x="921" y="394" font-size="12" fill="#94A3B8">返回 routes / rrf 解释</text></g>
