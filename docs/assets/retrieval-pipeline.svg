<text x="1196" y="260" font-size="19" font-weight="700" fill="#0F172A">重排</text>
<text x="1196" y="286" font-size="13" fill="#64748B">cross-encoder / LLM</text>
<text x="1196" y="312" font-size="13" fill="#334155">自适应跳过：</text>
<text x="1196" y="334" font-size="13" fill="#334155">top1 − top2 ≥ 0.05</text>
<text x="1196" y="370" font-size="12" fill="#94A3B8">失败优雅跳过并留痕</text>
<text x="1196" y="392" font-size="12" fill="#94A3B8">rerank_depth 默认 20</text></g>
<line x1="1320" y1="434" x2="1320" y2="468" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="1170" y="470" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="1170" y="470" width="6" height="102" rx="3" fill="#0F172A"/>
<text x="1196" y="504" font-size="19" font-weight="700" fill="#0F172A">Top-K 结果</text>
<text x="1196" y="530" font-size="13" fill="#64748B">分数 + 来源 + 引用页码 / 段落</text>
<text x="1196" y="552" font-size="13" fill="#64748B">检索为空 → 明确拒答</text></g>
<line x1="40" y1="600" x2="1560" y2="600" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="628" font-size="13" fill="#475569">实线：默认开启的向量链路　｜　虚线：可选图谱 / Wiki 路，需对应依赖就绪</text>
<text x="40" y="650" font-size="13" fill="#475569">任一路异常 → 该路缺席并在 meta.routes 写明原因；融合与重排仍按剩余路继续</text>
</svg>