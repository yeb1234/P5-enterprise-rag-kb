# 真实基础设施（生产化第 1 项）：PostgreSQL + Redis + Milvus
#
# 与项目根 docker-compose.yml 的 11 服务主干**互相独立**：这是"把演示切片换成真实
# 基础设施"的最小依赖集，只起数据层，不起应用。
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml ps
#   docker compose -f docker-compose.infra.yml down          # 保留 volume
#   docker compose -f docker-compose.infra.yml down -v       # 连数据一起删
#
# 端口全部只绑 127.0.0.1：这些库不该直接暴露公网，应用应在同一网络内访问。
#
# 宿主端口可用环境变量覆盖，**默认仍是标准端口**：
#   KB_PG_PORT / KB_REDIS_PORT / KB_MILVUS_PORT / KB_MILVUS_METRICS_PORT
# 本机实测：5432 与 6379 已被其它项目的容器占用（siteyeb-pg / siteyeb-redis），
# 所以本机用非默认端口起，不抢别人的端口也不停别人的容器：
#   KB_PG_PORT=55432 KB_REDIS_PORT=56379 docker compose -f docker-compose.infra.yml up -d
# 容器内部端口不变，应用配置只需改宿主侧连接串。
#
# 镜像名同样可覆盖（国内网络拉不到 Docker Hub 时用镜像站）：
#   KB_PG_IMAGE / KB_REDIS_IMAGE / KB_MILVUS_IMAGE / KB_ETCD_IMAGE / KB_MINIO_IMAGE
# 例：KB_PG_IMAGE=docker.m.daocloud.io/library/postgres:16-alpine
name: kb-infra

services:
  postgres:
    image: ${KB_PG_IMAGE:-postgres:16-alpine}
    container_name: kb-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_demo_only
      POSTGRES_DB: kb
      # 演示口令，生产必须换成密钥管理注入；不要写进仓库（本文件是示例）
    ports:
      - "127.0.0.1:${KB_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/pg_init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: ${KB_REDIS_IMAGE:-redis:7-alpine}
    container_name: kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${KB_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---- Milvus standalone 最小依赖：etcd（元数据）+ minio（对象存储） ----
  etcd:
    image: ${KB_ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.16}
    container_name: kb-etcd
    restart: unless-stopped
    mem_limit: 1g
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${KB_MINIO_IMAGE:-minio/minio:RELEASE.2023-03-20T20-16-18Z}
    container_name: kb-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: ${KB_MILVUS_IMAGE:-milvusdb/milvus:v2.5.10}
    container_name: kb-milvus
    restart: unless-stopped
    mem_limit: 4g
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      - "127.0.0.1:${KB_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${KB_MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  etcddata:
  miniodata:
  milvusdata:
