# 真实基础设施（生产化第 1 项）：PostgreSQL + Redis + Milvus
#
# 与项目根 docker-compose.yml 的 11 服务主干**互相独立**：这是"把演示切片换成真实
# 基础设施"的最小依赖集，只起数据层，不起应用。
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml ps
#   docker compose -f docker-compose.infra.yml down          # 保留 volume
#   docker compose -f docker-compose.infra.yml down -v       # 连数据一起删
#
# 端口全部只绑 127.0.0.1：这些库不该直接暴露公网，应用应在同一网络内访问。
#
# 宿主端口可用环境变量覆盖，**默认仍是标准端口**：
#   KB_PG_PORT / KB_REDIS_PORT / KB_MILVUS_PORT / KB_MILVUS_METRICS_PORT
# 本机实测：5432 与 6379 已被其它项目的容器占用（siteyeb-pg / siteyeb-redis），
# 所以本机用非默认端口起，不抢别人的端口也不停别人的容器：
#   KB_PG_PORT=55432 KB_REDIS_PORT=56379 docker compose -f docker-compose.infra.yml up -d
# 容器内部端口不变，应用配置只需改宿主侧连接串。
#
# 镜像名同样可覆盖（国内网络拉不到 Docker Hub 时用镜像站）：
#   KB_PG_IMAGE / KB_REDIS_IMAGE / KB_MILVUS_IMAGE / KB_ETCD_IMAGE / KB_MINIO_IMAGE
# 例：KB_PG_IMAGE=docker.m.daocloud.io/library/postgres:16-alpine
name: kb-infra

services:
  postgres:
    # 必须用带 pgvector 的镜像：官方 postgres 镜像不含扩展，
    # pg_init.sql 里第一句 CREATE EXTENSION vector 就会失败（有意不静默降级）。
    # 本机 Docker Hub 不可达，实际通过 KB_PG_IMAGE 指向 docker.m.daocloud.io/pgvector/pgvector:pg16。
    image: ${KB_PG_IMAGE:-pgvector/pgvector:pg16}
    container_name: kb-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_demo_only
      POSTGRES_DB: kb
      # 演示口令，生产必须换成密钥管理注入；不要写进仓库（本文件是示例）
    ports:
      - "127.0.0.1:${KB_PG_PORT:-5432}:5432"
    volumes:
      # v2：从 alpine 镜像迁到 pgvector 镜像时的数据卷（dump/restore 迁入）。
      # v1（kb-infra_pgdata）保留为回滚快照，确认稳定后可删。
      - pgdata_v2:/var/lib/postgresql/data
      - ./scripts/pg_init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: ${KB_REDIS_IMAGE:-redis:7-alpine}
    container_name: kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${KB_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---- Milvus standalone 最小依赖：etcd（元数据）+ minio（对象存储） ----
  etcd:
    # Milvus 的元数据存储。默认**不启动**：向量检索主链路走 pgvector，
    # Milvus 只保留为对照实验（docker compose --profile milvus up -d）。
    # 理由见 docs/production/08-vector-store-decision.md。
    profiles: ["milvus"]
    image: ${KB_ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.16}
    container_name: kb-etcd
    restart: unless-stopped
    mem_limit: 1g
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # 只为 Milvus 存在（KB_MILVUS_STORAGE=minio 时的对象存储），默认不起。
    image: ${KB_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: kb-minio
    restart: unless-stopped
    # 国内拉取提示：Docker Hub 上 minio 已迁 quay，常见加速站要么 denied 要么限流。
    # 实测可用源（2026-11-16）：
    #   KB_MINIO_IMAGE=swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    #
    # 只有 `--profile minio` 才起它。Milvus 的对象存储可用本地磁盘代替：
    #   KB_MILVUS_STORAGE=local → 不需要 minio（仅 standalone 单副本可用）
    #   KB_MILVUS_STORAGE=minio → 默认，生产形态，需要先拉 minio 镜像
    # 这样「拉不到 minio 的机器」也能把 Milvus 链路跑通，而不是整条链路卡住。
    # 两个 profile 都要能起它：--profile minio（单跑对象存储）/ --profile milvus（整条对照链路）
    profiles: ["minio", "milvus"]
    environment:
      # 2025 版起 MINIO_ACCESS_KEY/SECRET_KEY 已废弃，用 ROOT_USER/PASSWORD；
      # 两个都留着是为了兼容旧版本镜像（本项目实测用的是 RELEASE.2025-04-22）。
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    # 对照实验用：起它需要 etcd + minio 三个有状态组件，日常开发不值当。
    # 用法：docker compose -f docker-compose.infra.yml --profile milvus up -d
    profiles: ["milvus"]
    image: ${KB_MILVUS_IMAGE:-milvusdb/milvus:v2.5.10}
    container_name: kb-milvus
    restart: unless-stopped
    mem_limit: 4g
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # common.storageType：minio（默认，生产形态）| local（standalone 本地磁盘）
      COMMON_STORAGETYPE: ${KB_MILVUS_STORAGE:-minio}
      LOCALSTORAGE_PATH: /var/lib/milvus/data
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      - "127.0.0.1:${KB_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${KB_MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      # required:false —— 只起 milvus 而不起 minio（KB_MILVUS_STORAGE=local）时，
      # 不能让「缺一个可选依赖」把启动卡死。
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  pgdata_v2:      # 当前使用（pgvector 镜像）
  # pgdata:       # v1 快照：alpine 镜像 + 无 pgvector 时期的卷，回滚用；稳定后整行删除

  redisdata:
  etcddata:
  miniodata:
  milvusdata:
